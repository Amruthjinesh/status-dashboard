services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: status_db
      POSTGRES_USER: dash
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dash -d status_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    env_file: /home/ubuntu/status-app.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
