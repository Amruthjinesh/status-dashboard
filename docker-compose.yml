services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: status_db
      POSTGRES_USER: dash
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    env_file: /home/ubuntu/status-app.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
